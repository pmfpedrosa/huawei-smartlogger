name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests/unit -v
      - run: python -m compileall -q custom_components tools
      - run: pip install ruff
      - run: ruff check .
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: huawei-smartlogger
          path: dist/*.zip
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component
      - run: pytest -q
  windows-emulator:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller==6.22.3
      - run: python tools/build_emulator.py
      - run: .\dist\SmartLoggerEmulator.exe --version
      - run: python tools/smoke_emulator.py
      - uses: actions/upload-artifact@v4
        with:
          name: SmartLoggerEmulator-Windows-x64
          path: |
            dist/SmartLoggerEmulator.exe
            dist/SmartLoggerEmulator-*-Windows-x64.zip
